<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PROADI - Login</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Arquivo CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="min-h-screen flex items-center justify-center bg-slate-100 p-4">

    <main class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">

        <header class="text-center mb-8">
            <div class="text-4xl mb-3">💙</div>

            <h1 class="text-3xl font-bold text-blue-900">
                PROADI
            </h1>

            <p class="text-gray-600 mt-2">
                Acessibilidade Digital para Idosos
            </p>
        </header>

        <form id="loginForm" class="space-y-5">

            <div>
                <label for="email" class="block text-lg font-medium mb-2">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    class="w-full border border-gray-300 rounded-lg p-3 text-base focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required
                >
            </div>

            <div>
                <label for="senha" class="block text-lg font-medium mb-2">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    class="w-full border border-gray-300 rounded-lg p-3 text-base focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required
                >
            </div>

            <button
                type="submit"
                class="w-full bg-blue-800 text-white text-lg font-bold py-3 rounded-lg hover:bg-blue-900 transition"
            >
                Entrar
            </button>

        </form>

        <p class="text-center text-gray-600 mt-6">
            Ainda não tem uma conta?
            <a href="#" id="cadastroLink" class="text-blue-800 font-bold">
                Cadastre-se
            </a>
        </p>

        <button
            type="button"
            id="ajudaBtn"
            class="w-full mt-5 border-2 border-blue-800 text-blue-800 font-bold text-lg py-3 rounded-lg hover:bg-blue-50"
        >
            Preciso de ajuda
        </button>

        <p id="mensagem" class="text-center mt-4 text-blue-900" aria-live="polite"></p>

    </main>

    <!-- Arquivo JavaScript -->
    <script src="script.js"></script>

</body>
</html>
